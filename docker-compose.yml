# docker-compose.yml
version: '8.3.36-apache'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: laravel_roles_app
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - laravel_network
    command: bash -c "npm install && npm run build && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: laravel_roles_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_roles
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

  # NUEVO SERVICIO: phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_roles_pma
    ports:
      - "127.0.0.1:8081:80" # Puedes cambiar el 8080 si ese puerto ya está ocupado
    environment:
      PMA_HOST: db # Debe coincidir con el nombre del servicio de MySQL

    depends_on:
      - db
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  dbdata:
