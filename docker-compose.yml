services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    env_file: .env
    environment:
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: laravel_roles
      DB_USERNAME: laravel_user
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el .env del proyecto}
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]
    command: >
      sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R 775 storage bootstrap/cache
      && exec apache2-foreground"

  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_roles
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en el archivo privado mysql.env de Compose}
      LARAVEL_DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el .env del proyecto}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Configura DB_MIGRATION_PASSWORD en el archivo privado mysql.env de Compose}
    volumes:
      - dbdata:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]

networks:
  frontend:
  database:
    internal: true

volumes:
  dbdata:
  app_storage:
  app_cache:
