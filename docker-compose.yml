# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: laravel_roles_app
    ports:
      - "127.0.0.1:80:80"     # solo redirige a HTTPS
      - "127.0.0.1:443:443"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - laravel_network
    command: bash -c "npm install && npm run build && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: laravel_roles_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_roles
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # SIN "ports": MySQL no se publica. Solo la app lo alcanza por la red interna de Docker.
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

  # phpMyAdmin: herramienta de laboratorio, solo en localhost. Apágala con: docker compose stop phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_roles_pma
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  dbdata:
