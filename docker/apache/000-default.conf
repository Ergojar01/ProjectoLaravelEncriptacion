<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    # Nunca se aceptan credenciales por HTTP: todo se redirige a HTTPS
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [F,L]
    RewriteRule ^ https://localhost%{REQUEST_URI} [R=301,L]
    SetEnvIf Request_URI "(^|/)restablecer/" skip_reset_log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!skip_reset_log
</VirtualHost>
