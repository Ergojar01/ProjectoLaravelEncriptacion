<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/haki/localhost.crt
    SSLCertificateKeyFile /etc/ssl/haki/localhost.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # El código fuente y los archivos ocultos no se sirven
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
